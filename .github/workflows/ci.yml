name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bets
          POSTGRES_PASSWORD: bets
          POSTGRES_DB: bets
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bets"
          --health-interval 2s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: test (unit + Postgres integration)
        run: go test -race -count=1 -coverprofile=coverage.out ./...
        env:
          TEST_DATABASE_URL: postgres://bets:bets@localhost:5432/bets?sslmode=disable
      - run: go tool cover -func=coverage.out | tail -1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t bet-settlement-go .
